[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bruhanimate"
version = "1.4.0"
description = "Composable ASCII terminal animations and solver playback"
authors = [{name = "Ethan Christensen", email = "ethanlchristensen@outlook.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"
keywords = ["python", "terminal", "terminal-animation", "bruhanimate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "future>=1.0.0,<2.0.0",
    "bruhcolor>=0.0.66,<0.0.67",
    "pyfiglet>=1.0.4,<2.0.0",
    "numpy>=2.3.4,<3.0.0",
    "pywin32>=311,<313; sys_platform == 'win32'",
]

[project.scripts]
bruhanimate = "bruhanimate.cli:main"

[project.optional-dependencies]
audio = [
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "sounddevice>=0.4; sys_platform != 'win32'",
]
export = [
    "imageio-ffmpeg>=0.6,<0.7",
    "pillow>=12.1.1,<14",
]

[project.urls]
Homepage = "https://github.com/ethanlchristensen/bruh.animate"
Repository = "https://github.com/ethanlchristensen/bruh.animate"
Documentation = "https://ethanlchristensen.github.io/bruh.animate/"
"Bug Tracker" = "https://github.com/ethanlchristensen/bruh.animate/issues"

[dependency-groups]
docs = ["sphinx==8.1.3", "furo==2024.8.6"]
dev = [
    "ruff>=0.14.7,<0.15",
    "pytest>=8.3.4,<9",
    "pytest-cov>=6.0.0,<7",
    "twine>=6.2.0,<7",
    "PyYAML>=6.0.3,<7",
    "mypy>=1.15,<2",
]

[tool.uv]
required-version = "==0.13.4"


[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=bruhanimate --cov-report=term-missing"

[tool.mypy]
files = ["tests/typing/tools.py", "bruhanimate/_clock.py", "bruhanimate/_validation.py", "bruhanimate/background.py", "bruhanimate/browser.py", "bruhanimate/cache.py", "bruhanimate/config.py", "bruhanimate/history.py", "bruhanimate/themes.py", "bruhanimate/tween.py", "bruhanimate/playback.py", "bruhanimate/grid.py", "bruhanimate/effects.py", "bruhanimate/cli.py", "bruhanimate/bruheffect/registry.py", "bruhanimate/bruheffect/settings.py", "bruhanimate/bruhutil/bruhffer.py", "bruhanimate/bruheffect/water_effect.py", "bruhanimate/bruheffect/smoke_effect.py", "bruhanimate/bruheffect/metaballs_effect.py", "bruhanimate/bruheffect/cloth_effect.py", "bruhanimate/bruheffect/terrain_effect.py", "bruhanimate/bruheffect/_fields.py", "bruhanimate/demos/nature_demo.py", "bruhanimate/motion.py", "bruhanimate/export.py", "bruhanimate/demos/routing_demo.py", "bruhanimate/sequence.py", "bruhanimate/masks.py", "bruhanimate/styling.py", "bruhanimate/demos/_image_cycle.py", "bruhanimate/demos/image_demo.py", "bruhanimate/image.py", "bruhanimate/views.py", "bruhanimate/keyboard.py", "bruhanimate/resize.py", "bruhanimate/player.py", "tests/typing/discovery.py", "bruhanimate/capture.py", "bruhanimate/scene.py", "bruhanimate/panel.py", "bruhanimate/layout.py", "bruhanimate/widgets.py", "bruhanimate/demos/dashboard_demo.py", "bruhanimate/demos/beam_demo.py", "bruhanimate/demos/tv_demo.py", "bruhanimate/demos/windows_demo.py"]
python_version = "3.13"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
